name: Release

# Publishes v<versionName> when muabet.versionName in gradle.properties changes on main, for a
# matching v* tag, or by hand. Any other run stops after the quick version check.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['gradle.properties', '.github/workflows/release.yml']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version and whether it is already released
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^muabet\.versionName=\(.*\)$/\1/p' gradle.properties | head -1)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::muabet.versionName must be MAJOR.MINOR.PATCH (got '$VERSION')"
            exit 1
          fi
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION}"
            exit 1
          fi
          SKIP=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released: nothing to build. Bump the version to release."
            SKIP=true
          fi
          { echo "version=${VERSION}"; echo "tag=${TAG}"; echo "skip=${SKIP}"; } >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.jks
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No signing key in the secrets: the APK is signed with the shared debug key."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Test and build the release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew test assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Muabet-${TAG}.apk"
          rm -f release.jks
      - name: Delete preview pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: "Muabet ${{ env.TAG }}"
          body: |
            Release APK built from `${{ github.sha }}`.
            ${{ env.SIGNED == 'true' && 'Signed with the release key.' || 'Signed with the shared debug key.' }}
          files: Muabet-${{ env.TAG }}.apk
          fail_on_unmatched_files: true
