org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App version, MAJOR.MINOR.PATCH. versionCode is derived (MAJOR*10000 + MINOR*100 + PATCH).
# Bumping muabet.versionName on main publishes a release (see .github/workflows/release.yml).
muabet.versionName=1.0.0
